        const CheckCircleIcon = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>;
        const MessageCircleIcon = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" /></svg>;
        const LayersIcon = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" /></svg>;
        const HelpCircleIcon = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>;
        const EditIcon = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" /></svg>;
        const VolumeIcon = ({ className = "w-5 h-5" }) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" /></svg>;

        // --- 功能组件 ---

        // 1. 生词闪卡组件
        const Flashcards = () => {
            const [flipped, setFlipped] = useState(Array(VOCABULARY.length).fill(false));

            const toggleFlip = (index) => {
                const newFlipped = [...flipped];
                newFlipped[index] = !newFlipped[index];
                setFlipped(newFlipped);
            };

            return (
                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6 p-4">
                    {VOCABULARY.map((word, idx) => (
                        <div 
                            key={idx} 
                            className="relative w-full h-56 perspective-1000 cursor-pointer"
                            onClick={() => toggleFlip(idx)}
                        >
                            <div className={`w-full h-full relative transform-style-3d flip-card-inner rounded-2xl shadow-lg ${flipped[idx] ? 'rotate-y-180' : ''}`}>
                                {/* Front of Card (Chinese + Pinyin) */}
                                <div className="absolute w-full h-full backface-hidden bg-white border-2 border-red-100 rounded-2xl flex flex-col items-center justify-center p-4">
                                    <button 
                                        onClick={(e) => { e.stopPropagation(); speak(word.ch); }}
                                        className="absolute top-4 right-4 p-2 bg-red-50 text-red-500 rounded-full hover:bg-red-100 transition-colors"
                                        title="Tinglash / Слушать"
                                    >
                                        <VolumeIcon />
                                    </button>
                                    <span className="text-6xl font-bold text-red-600 mb-4">{word.ch}</span>
                                    <span className="text-xl text-gray-600">{word.py}</span>
                                </div>
                                
                                {/* Back of Card (Translations) */}
                                <div className="absolute w-full h-full backface-hidden rotate-y-180 bg-red-50 rounded-2xl flex flex-col items-center justify-center p-6 text-center shadow-inner">
                                    <div className="space-y-3 w-full">
                                        <div className="bg-white p-2 rounded border border-red-100">
                                            <span className="text-xs font-bold text-red-400 block mb-1">UZBEK</span>
                                            <span className="text-md font-medium text-gray-800">{word.uz}</span>
                                        </div>
                                        <div className="bg-white p-2 rounded border border-blue-100">
                                            <span className="text-xs font-bold text-blue-400 block mb-1">РУССКИЙ</span>
                                            <span className="text-md font-medium text-gray-800">{word.ru}</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    ))}
                </div>
            );
        };

        // 2. 测验组件 (Reusable Quiz)
        const QuizRunner = ({ questions, title }) => {
            const [currentQ, setCurrentQ] = useState(0);
            const [score, setScore] = useState(0);
            const [showResult, setShowResult] = useState(false);
            const [selectedOption, setSelectedOption] = useState(null);
            const [isAnswered, setIsAnswered] = useState(false);

            const handleAnswer = (index) => {
                if (isAnswered) return;
                setSelectedOption(index);
                setIsAnswered(true);
                if (index === questions[currentQ].correctIndex) {
                    setScore(score + 1);
                }
            };

            const nextQuestion = () => {
                if (currentQ < questions.length - 1) {
                    setCurrentQ(currentQ + 1);
                    setSelectedOption(null);
                    setIsAnswered(false);
                } else {
                    setShowResult(true);
                }
            };

            const restartQuiz = () => {
                setCurrentQ(0);
                setScore(0);
                setShowResult(false);
                setSelectedOption(null);
                setIsAnswered(false);
            };

            if (showResult) {
                return (
                    <div className="max-w-2xl mx-auto mt-10 p-8 bg-white rounded-2xl shadow-xl text-center border-t-8 border-red-500">
                        <h2 className="text-3xl font-bold mb-4">Test yakunlandi! / Тест завершен!</h2>
                        <p className="text-xl mb-6">Sizning natijangiz / Ваш результат: <span className="font-bold text-red-600">{score}</span> / {questions.length}</p>
                        <div className="w-full bg-gray-200 rounded-full h-4 mb-6">
                            <div className="bg-red-500 h-4 rounded-full" style={{ width: `${(score / questions.length) * 100}%` }}></div>
                        </div>
                        <button onClick={restartQuiz} className="px-6 py-3 bg-red-600 text-white rounded-lg hover:bg-red-700 transition font-bold shadow-md">
                            Testni qayta boshlash / Начать тест заново
                        </button>
                    </div>
                );
            }

            const q = questions[currentQ];

            return (
                <div className="max-w-3xl mx-auto mt-6 p-6 md:p-10 bg-white rounded-2xl shadow-lg border border-gray-100">
                    <div className="flex justify-between items-center mb-6">
                        <h3 className="text-lg font-semibold text-gray-500">{title}</h3>
                        <span className="px-3 py-1 bg-red-100 text-red-800 rounded-full text-sm font-bold">
                            {currentQ + 1} / {questions.length}
                        </span>
                    </div>
                    
                    <h2 className="text-3xl font-bold mb-8 text-gray-800 text-center tracking-wider">{q.question}</h2>
                    
                    <div className="space-y-4">
                        {q.options.map((opt, idx) => {
                            let btnClass = "w-full text-left p-4 rounded-xl border-2 transition-all font-medium text-lg ";
                            if (!isAnswered) {
                                btnClass += "border-gray-200 hover:border-red-400 hover:bg-red-50 text-gray-700 cursor-pointer";
                            } else {
                                if (idx === q.correctIndex) {
                                    btnClass += "border-green-500 bg-green-50 text-green-800";
                                } else if (idx === selectedOption) {
                                    btnClass += "border-red-500 bg-red-50 text-red-800";
                                } else {
                                    btnClass += "border-gray-200 opacity-50 cursor-not-allowed";
                                }
                            }

                            return (
                                <button key={idx} disabled={isAnswered} onClick={() => handleAnswer(idx)} className={btnClass}>
                                    <span className="inline-block w-8 font-bold text-gray-400">{String.fromCharCode(65 + idx)}.</span> {opt}
                                </button>
                            );
                        })}
                    </div>

                    {isAnswered && (
                        <div className="mt-8 flex justify-end">
                            <button onClick={nextQuestion} className="px-8 py-3 bg-red-600 text-white rounded-lg hover:bg-red-700 transition font-bold shadow-md flex items-center">
                                {currentQ < questions.length - 1 ? 'Keyingi savol ➔ / Следующий вопрос ➔' : 'Natijalarni ko\'rish / Посмотреть результаты'}
                            </button>
                        </div>
                    )}
                </div>
            );
        };

        // 3. 对话组件
        const Dialogues = () => {
            return (
                <div className="max-w-5xl mx-auto space-y-8 p-4">
                    {DIALOGUES.map((dialogue, dIdx) => (
                        <div key={dIdx} className="bg-white rounded-2xl shadow-md overflow-hidden border border-gray-100">
                            <div className="bg-red-600 text-white px-6 py-4">
                                <h3 className="text-xl font-bold">{dialogue.title}</h3>
                            </div>
                            <div className="divide-y divide-gray-100">
                                {dialogue.lines.map((line, lIdx) => (
                                    <div key={lIdx} className="p-6 hover:bg-gray-50 transition-colors">
                                        <div className="flex flex-col md:flex-row gap-4">
                                            <div className="md:w-1/3 flex-shrink-0">
                                                <span className="inline-block px-3 py-1 bg-red-100 text-red-800 rounded-lg text-sm font-bold mb-2">
                                                    {line.speaker}
                                                </span>
                                                <div className="flex items-center mb-1">
                                                    <p className="text-xl font-bold text-gray-900">{line.ch}</p>
                                                    <button 
                                                        onClick={() => speak(line.ch)}
                                                        className="ml-3 p-1.5 bg-gray-200 text-gray-600 rounded-full hover:bg-gray-300 transition-colors flex-shrink-0"
                                                        title="Tinglash / Слушать"
                                                    >
                                                        <VolumeIcon className="w-4 h-4" />
                                                    </button>
                                                </div>
                                                <p className="text-md text-gray-500">{line.py}</p>
                                            </div>
                                            <div className="md:w-2/3 space-y-3 border-l-2 border-gray-200 pl-4 md:pl-6">
                                                <div>
                                                    <span className="text-xs font-bold text-gray-400 block">UZBEK</span>
                                                    <p className="text-sm text-gray-700">{line.translations.uz}</p>
                                                </div>
                                                <div>
                                                    <span className="text-xs font-bold text-gray-400 block">РУССКИЙ</span>
                                                    <p className="text-sm text-gray-700">{line.translations.ru}</p>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    ))}
                </div>
            );
        };

        // 4. 语法解释组件
        const GrammarSection = () => {
            return (
                <div className="max-w-4xl mx-auto space-y-8 p-4">
                    {GRAMMAR.map((grammar, idx) => (
                        <div key={idx} className="bg-white rounded-2xl shadow-lg border border-gray-200 overflow-hidden">
                            <div className="bg-gradient-to-r from-red-600 to-red-500 px-6 py-4">
                                <h2 className="text-2xl font-bold text-white">{grammar.title}</h2>
                            </div>
                            
                            <div className="p-6 space-y-6">
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div className="bg-blue-50 p-4 rounded-xl">
                                        <h4 className="text-xs font-bold text-blue-800 mb-2 uppercase">Uzbek Tushuntirish</h4>
                                        <p className="text-sm text-blue-900">{grammar.translations.uz}</p>
                                    </div>
                                    <div className="bg-green-50 p-4 rounded-xl">
                                        <h4 className="text-xs font-bold text-green-800 mb-2 uppercase">Русское Объяснение</h4>
                                        <p className="text-sm text-green-900">{grammar.translations.ru}</p>
                                    </div>
                                </div>

                                <div className="mt-8">
                                    <h3 className="text-lg font-bold text-gray-800 mb-4 flex items-center">
                                        <BookOpenIcon /> <span className="ml-2">Misollar / Примеры (例如)</span>
                                    </h3>
                                    <div className="space-y-4">
                                        {grammar.examples.map((ex, exIdx) => (
                                            <div key={exIdx} className="p-4 bg-gray-50 rounded-lg border-l-4 border-red-500 flex flex-col sm:flex-row gap-4">
                                                <div className="flex-1">
                                                    <div className="flex items-center">
                                                        <p className="text-lg font-bold text-gray-900">{ex.ch}</p>
                                                        <button 
                                                            onClick={() => speak(ex.ch)}
                                                            className="ml-2 p-1 text-gray-400 hover:text-red-500 transition-colors"
                                                        >
                                                            <VolumeIcon className="w-4 h-4" />
                                                        </button>
                                                    </div>
                                                    <p className="text-md text-gray-600 mb-2">{ex.py}</p>
                                                    <div className="text-sm text-gray-500 grid grid-cols-1 gap-2">
                                                        <p><span className="font-bold">UZ:</span> {ex.uz}</p>
                                                        <p><span className="font-bold">RU:</span> {ex.ru}</p>
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    ))}
                </div>
            );
        };

        // 5. 词语填空组件 (Fill in the blanks)
        const FillInBlanks = () => {
            const [answers, setAnswers] = useState({});

            const handleSelect = (gIdx, qIdx, value) => {
                setAnswers({ ...answers, [`${gIdx}_${qIdx}`]: value });
            };

            return (
                <div className="max-w-4xl mx-auto space-y-8 p-4">
                    <div className="text-center mb-6">
                        <h2 className="text-2xl font-bold text-gray-800">选择恰当的词语填空</h2>
                        <p className="text-gray-500">Bo'shliqlarga mos so'zlarni tanlang / Выберите подходящие слова</p>
                    </div>

                    {FILL_BLANKS_DATA.map((group, gIdx) => (
                        <div key={gIdx} className="bg-white rounded-2xl shadow-lg border border-gray-200 p-6 md:p-8">
                            {/* Word Bank */}
                            <div className="flex flex-wrap gap-3 mb-8 p-4 bg-red-50 rounded-xl justify-center shadow-inner">
                                {group.words.map((w, i) => (
                                    <button 
                                        key={i} 
                                        onClick={() => speak(w)}
                                        className="flex items-center px-4 py-2 bg-white text-red-700 font-bold text-lg rounded-lg shadow-sm border border-red-200 hover:bg-red-100 transition-colors"
                                    >
                                        {w} <VolumeIcon className="w-4 h-4 ml-2 opacity-50" />
                                    </button>
                                ))}
                            </div>
                            
                            {/* Sentences */}
                            <div className="space-y-6">
                                {group.questions.map((q, qIdx) => {
                                    const ansKey = `${gIdx}_${qIdx}`;
                                    const selected = answers[ansKey] || "";
                                    const isCorrect = selected === q.answer;
                                    const isAnswered = selected !== "";
                                    
                                    const parts = q.text.split("___");

                                    return (
                                        <div key={qIdx} className="text-lg md:text-xl font-medium text-gray-800 flex flex-wrap items-center gap-2 p-3 bg-gray-50 rounded-xl">
                                            <span className="w-8 text-center font-bold text-red-400">{qIdx + 1}.</span>
                                            <span>{parts[0]}</span>
                                            <select
                                                value={selected}
                                                onChange={(e) => handleSelect(gIdx, qIdx, e.target.value)}
                                                className={`mx-2 p-1 md:p-2 rounded-lg border-2 outline-none font-bold cursor-pointer transition-colors text-center ${
                                                    !isAnswered ? 'border-gray-300 bg-white text-gray-400' :
                                                    isCorrect ? 'border-green-500 bg-green-50 text-green-700' : 'border-red-500 bg-red-50 text-red-700'
                                                }`}
                                            >
                                                <option value="" disabled>...</option>
                                                {group.words.map((w, i) => (
                                                    <option key={i} value={w}>{w}</option>
                                                ))}
                                            </select>
                                            <span>{parts[1]}</span>
                                            
                                            {isAnswered && (
                                                <span className={`ml-2 text-2xl ${isCorrect ? 'text-green-500' : 'text-red-500'}`}>
                                                    {isCorrect ? '✓' : '✗'}
                                                </span>
                                            )}
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    ))}
                </div>
            );
        };

        // --- 主应用 ---
        function App() {
            const [activeTab, setActiveTab] = useState('flashcards');

            return (
                <div className="min-h-screen">
                    {/* 头部 (Header) */}
                    <header className="bg-white shadow-sm sticky top-0 z-10">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
                            <div className="flex flex-col md:flex-row justify-between items-center gap-4">
                                <div className="text-center md:text-left">
                                    <h1 className="text-3xl font-extrabold text-red-600 tracking-tight flex items-center justify-center md:justify-start">
                                        她的汉语说得跟中国人一样好
                                        <button onClick={() => speak("她的汉语说得跟中国人一样好")} className="ml-3 p-2 bg-red-50 text-red-500 rounded-full hover:bg-red-100 transition-colors">
                                            <VolumeIcon className="w-6 h-6" />
                                        </button>
                                    </h1>
                                    <h2 className="text-lg font-medium text-gray-500 mt-1">
                                        Dilfuza Kāng lǎo shī bilan xitoy tilini o'rganmiz
                                    </h2>
                                </div>
                                <div className="flex items-center space-x-2 text-sm font-bold bg-red-50 text-red-700 px-4 py-2 rounded-full border border-red-200">
                                    <span>HSK 3</span>
                                    <span className="w-1.5 h-1.5 bg-red-400 rounded-full"></span>
                                    <span>Lesson 9</span>
                                </div>
                            </div>
                        </div>
                        
                        {/* 导航标签 (Tabs) */}
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex overflow-x-auto border-b border-gray-200 pb-px hide-scrollbar space-x-8">
                                <button onClick={() => setActiveTab('flashcards')} className={`flex items-center py-4 px-1 border-b-2 font-medium text-sm whitespace-nowrap transition-colors ${activeTab === 'flashcards' ? 'border-red-500 text-red-600' : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'}`}>
                                    <LayersIcon /> <span className="ml-2">生词闪卡 (Fleshkartalar / Карточки)</span>
                                </button>
                                <button onClick={() => setActiveTab('vocabTest')} className={`flex items-center py-4 px-1 border-b-2 font-medium text-sm whitespace-nowrap transition-colors ${activeTab === 'vocabTest' ? 'border-red-500 text-red-600' : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'}`}>
                                    <CheckCircleIcon /> <span className="ml-2">生词测试 (Lug'at testi / Тест)</span>
                                </button>
                                <button onClick={() => setActiveTab('fillBlanks')} className={`flex items-center py-4 px-1 border-b-2 font-medium text-sm whitespace-nowrap transition-colors ${activeTab === 'fillBlanks' ? 'border-red-500 text-red-600' : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'}`}>
                                    <EditIcon /> <span className="ml-2">词语填空 (Mashqlar / Упражнения)</span>
                                </button>
                                <button onClick={() => setActiveTab('dialogues')} className={`flex items-center py-4 px-1 border-b-2 font-medium text-sm whitespace-nowrap transition-colors ${activeTab === 'dialogues' ? 'border-red-500 text-red-600' : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'}`}>
                                    <MessageCircleIcon /> <span className="ml-2">对话内容 (Dialoglar / Диалоги)</span>
                                </button>
                                <button onClick={() => setActiveTab('grammar')} className={`flex items-center py-4 px-1 border-b-2 font-medium text-sm whitespace-nowrap transition-colors ${activeTab === 'grammar' ? 'border-red-500 text-red-600' : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'}`}>
                                    <BookOpenIcon /> <span className="ml-2">语法解释 (Grammatika / Грамматика)</span>
                                </button>
                                <button onClick={() => setActiveTab('grammarTest')} className={`flex items-center py-4 px-1 border-b-2 font-medium text-sm whitespace-nowrap transition-colors ${activeTab === 'grammarTest' ? 'border-red-500 text-red-600' : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'}`}>
                                    <HelpCircleIcon /> <span className="ml-2">语法测试 (Grammatika testi)</span>
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* 主体内容 (Main Content) */}
                    <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                        {activeTab === 'flashcards' && <Flashcards />}
                        {activeTab === 'vocabTest' && <QuizRunner questions={VOCAB_TEST} title="生词测试 / Lug'at testi / Тест по словарю" />}
                        {activeTab === 'fillBlanks' && <FillInBlanks />}
                        {activeTab === 'dialogues' && <Dialogues />}
                        {activeTab === 'grammar' && <GrammarSection />}
                        {activeTab === 'grammarTest' && <QuizRunner questions={GRAMMAR_TEST} title="语法测试 / Grammatika testi / Тест по грамматике" />}
                    </main>

                    {/* 页脚 (Footer) */}
                    <footer className="bg-white border-t border-gray-200 mt-12">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex flex-col items-center justify-center text-center">
                            <p className="text-gray-500 font-medium mb-2">HSK 3 Standard Course - Lesson 9</p>
                            <p className="text-sm text-gray-400">© 2026 Dilfuza Kāng lǎo shī (telegram@diffila)</p>
                        </div>
                    </footer>
                </div>
            );
        }

        // 渲染 React 应用 (使用全局的 ReactDOM 对象)
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
